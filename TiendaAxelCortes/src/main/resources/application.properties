spring.application.name=TiendaAxelCortes
#Para definir el puerto donde escucha el servidor web
server.port=80

#Para definir el formato de despliegue de fecha y hora del log
logging.pattern.dateformat=hh:mm

#Para evitar mensajes invasivos
spring.main.banner-mode=off

#En producción esto es true, en desarrollo es false
spring.thymeleaf.cache=false

#Conexion a la BD local TechShop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop


#Usuario y clave de la base de datos -creaTablas.sql-
spring.datasource.username=root
spring.datasource.password=Axel

#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#para mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=Trace

spring.jpa.hibernate.ddl-auto=update

#Esta información se utiliza para obtener acceso a su storage.
firebase.bucket.name=techshop-e1f76.firebasestorage.app
firebase.storage.path=techshop
firebase.json.path=firebase
firebase.json.file=techshop-e1f76-firebase-adminsdk-fbsvc-79510f8926.json

# Aumentar el límite de tamaño para subir imágenes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB